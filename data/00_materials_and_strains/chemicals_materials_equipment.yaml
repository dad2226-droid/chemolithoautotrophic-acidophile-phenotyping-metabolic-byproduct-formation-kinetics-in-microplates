document_type: study_materials_inventory
title: Chemicals, materials, and equipment used in this study
reading_guide:
  scope: "58 tested additives, 4 additional attempted preparations excluded from additive tests, 21 medium/assay reagents or preparations, and 32 materials/equipment entries. Experimental batch assignments remain in family metadata."
  equipment_information: "Product identities, lots, applications, closures and device assignments are listed in the inventory. Supplier specifications and experimental settings have separate fields."
  sources: "Source paths are relative to the directory containing data/. The node field selects the source field or table entry."
  table_fields: "Display fields correspond to the 8-column Markdown chemical inventory. The source_number field contains the source/catalog identifier."
  supplement_scope: "MD-TMS is a purchased commercial supplement. TE Buffer was prepared as described in method_references.Dailey2026."
  reference_numbers: "Chemical reference numbers resolve in chemicals_materials_equipment.md#references."
  stock_basis: "Maximum 2x additive concentration by additive_stock_pH across AF/AT/LF records; 2 times the concentration on the 200 uL basis, in salt formula units. Elemental Ga in the mixed experiment is divided by 2. Starred entries are nominal preparation targets for compounds excluded from additive tests, stored in attempted_stock_preparations."
  concentration_determination: "N marks nominal concentrations in the Markdown stock column. Assignments follow biological_definitions.yaml concentration_conventions.nominal_reagents. Sodium thiosulfate and potassium tetrathionate are nominal in all uses. The other 47 additives use an ICP-based concentration determination, including Ti and Zr stocks."
  preparation_asterisk: "Not visibly soluble at the indicated preparation concentration or after a further 4-fold dilution in sulfuric acid at the target pH; excluded from additive tests."
  reagent_information: "CAS number grouping and zero-padding are normalized. Concentration values and their determination methods are specified for each record."
  stock_preparation_inputs:
    scope: "14 mass-and-final-volume pairs: 10 nominal additive stocks, the thymol blue stock, and 3 excluded preparations."
    location: preparation_record within each matching maximum_additive_stocks or attempted_stock_preparations
      entry; the thymol blue record is in experimental_definitions.yaml under reagent_preparations.thymol_blue.
    calculation: mass_g / formula_mass_for_nominal_calculation_g_per_mol / (final_volume_mL / 1000)
    formula_mass_reference: https://www.ciaaw.org/abridged-atomic-weights.htm
    nominal_basis: "Calculations use a purity factor of 1."
    volume_basis: "The calculation uses final solution volume."
    concentration_scope: "Preparation calculations describe nominal compound concentrations. Excluded-preparation targets describe the quantities prepared for dissolution attempts."
    record_scope: "A preparation entry is associated with its reagent and stock pH."
