document_type: study_strain_inventory
title: Strains used in this study
reading_guide:
  sources: Paths are relative to the deposit root.
  culture_collections: ATCC and DSM identifiers are strain designations.
  abiotic_controls: Ab denotes an abiotic control and is not a strain.
  starter_identity: Family metadata define physical-vessel, batch_id, inoculum_culture_ID and replicate
    assignments. Only independent physical microplates are biological replicates. Each microplate
    uses 3 separately grown cultures for rows E, F and G; other replicate microplates use
    independent sets of 3 cultures.
  LF_cohorts: LF microplate starters and their qualitative follow-up are separate from the freshly
    thawed test-tube starters.
